services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptoai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cryptoaidb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptoaidb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cryptoai-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptoai-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cryptoaidb
      DB_USERNAME: postgres
      DB_PASSWORD: password
      JWT_SECRET: c4b1d6f8e2a39158c70d4957e62a0487b92f39c4d8123e4f7a1b9c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f
    networks:
      - cryptoai-network

volumes:
  postgres_data:
    driver: local

networks:
  cryptoai-network:
    driver: bridge
